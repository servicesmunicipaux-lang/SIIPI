# ---------------------------------------------------------------------------
# SIIPI — déploiement (base + API construites depuis les sources).
#
# Prérequis : un fichier .env à la racine définissant DB_PASSWORD et
# JWT_SECRET (voir .env.example). L'API refuse de démarrer en production
# avec le secret JWT de développement.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm api npm run migrate:prod
#
# Le service front-end sera ajouté ici lors de la reconstruction du
# front-end (il n'existe pas encore d'image web de production).
#
# Avant toute mise en service réelle, il reste à ajouter : un reverse proxy
# TLS devant l'API, une sauvegarde planifiée du volume PostgreSQL, et la
# journalisation centralisée.
# ---------------------------------------------------------------------------

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: siipi_db
    restart: always
    environment:
      POSTGRES_DB: siipi_national
      POSTGRES_USER: siipi_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - siipi_postgres_data:/var/lib/postgresql/data
    networks: [siipi-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siipi_admin -d siipi_national"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: siipi/api:latest
    container_name: siipi_api
    restart: always
    init: true
    environment:
      DATABASE_URL: postgres://siipi_admin:${DB_PASSWORD:?}@db:5432/siipi_national
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      SIIPI_FICHIERS_DIR: /var/siipi/fichiers
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      NODE_ENV: production
    volumes:
      # Les octets des photos et documents. Volume nommé : ils survivent à la
      # reconstruction du conteneur, et une sauvegarde du volume suffit à les
      # emporter — ils ne sont pas en base, volontairement.
      - siipi_fichiers:/var/siipi/fichiers
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    networks: [siipi-net]

volumes:
  siipi_postgres_data:
  siipi_fichiers:

networks:
  siipi-net:
    driver: bridge
