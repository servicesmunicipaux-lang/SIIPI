# ---------------------------------------------------------------------------
# SIIPI — déploiement (base + API construites depuis les sources).
#
# NE SE LANCE PAS À LA MAIN (chantier P, lot P6) : l'installation, la mise à jour
# et le retour arrière passent par backend/exploitation/deploiement/ (installer.sh,
# mettre_a_jour.sh, revenir.sh ; docs/exploitation/). Ils vérifient le .env avant
# tout geste, étiquettent les images par version (SIIPI_VERSION, jamais latest),
# fixent la base « production » avant tout chargement, sauvegardent et copient la
# base avant une mise à jour, et reviennent seuls en arrière si elle échoue.
#
# Prérequis : un fichier .env à la racine définissant DB_PASSWORD, JWT_SECRET,
# SIIPI_SECRET_IDENTITES, SIIPI_SECRET_GPS, SIIPI_DOMAINE et SIIPI_TLS (voir .env.example). L'API
# refuse de démarrer en production avec un secret de développement.
#
# HTTPS (chantier P, lot P4) : le service `frontal` (Caddy, image construite
# depuis web/) sert le front à / et relaie /api vers l'API, sur une seule
# origine. Il est le SEUL à publier des ports : 80 (renvoi vers HTTPS, et le
# renouvellement Let's Encrypt) et 443. L'API et la base n'ont aucun port sur
# l'hôte. Le certificat : SIIPI_TLS (voir backend/exploitation/frontal/Caddyfile).
#
#   bash backend/exploitation/deploiement/installer.sh <adresse FNCT> "<nom complet>"
#   bash backend/exploitation/deploiement/mettre_a_jour.sh
#   bash backend/exploitation/deploiement/revenir.sh <base> <version>
#
# Production ou formation (D-FNCT-5, README.md « Production et formation ») :
# PRODUCTION=true par défaut ici. Une instance de formation se lance avec
# FORMATION=true et PRODUCTION=false, sous un autre nom (SIIPI_INSTANCE) : elle
# a alors ses propres conteneurs et ses propres volumes, donc sa propre base.
#
# Conservation des photos (D-FNCT-4) : à 36 mois, chaque photo est compressée
# et son original part dans l'archive froide (volume siipi_archive_froide).
# Ce volume se SAUVEGARDE À PART et se garde hors ligne : c'est la seule copie
# des originaux. La tâche refuse de compresser tant que son témoin n'y est pas.
#
# Sauvegardes (chantier P, lot P2) : le service `sauvegarde` prend chaque nuit,
# à SAUVEGARDE_HEURE (heure de Tunis), la base et les fichiers ensemble, chiffrés
# pour les clés publiques age de SAUVEGARDE_DESTINATAIRES (deux clés, une par
# personne de la FNCT ; les clés privées ne viennent jamais sur ce serveur). Il
# en garde 7 dates, 4 dimanches et 12 premiers du mois, et les copie vers
# SAUVEGARDE_DESTINATION ; l'archive froide y part original par original, jamais
# effacée. Le distant rclone se décrit dans sauvegarde.env (RCLONE_CONFIG_*),
# facultatif. Une sauvegarde à la main :
#   docker compose -p <instance> -f docker-compose.prod.yml exec sauvegarde /opt/sauvegarde/sauvegarder.sh
#
# Supervision (chantier P, lot P5) : le service `surveillance`, à part de l'API,
# vérifie toutes les 5 minutes l'API, le site, le certificat, la sauvegarde, sa
# copie hors serveur et le disque, et écrit son constat dans le volume
# siipi_supervision, que l'API lit pour l'écran « État de l'exploitation ».
# Une panne envoie un courriel à SUPERVISION_DESTINATAIRES, au changement
# d'état seulement. Si le serveur entier s'arrête, il ne peut pas prévenir : une
# surveillance extérieure de https://<domaine>/api/health reste nécessaire.
#
# Avant toute mise en service réelle, il reste à ajouter : la procédure de
# déploiement (lot P6).
# ---------------------------------------------------------------------------

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: ${SIIPI_INSTANCE:-siipi}_db
    restart: always
    environment:
      POSTGRES_DB: siipi_national
      POSTGRES_USER: siipi_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
    volumes:
      - siipi_postgres_data:/var/lib/postgresql/data
    networks: [siipi-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siipi_admin -d siipi_national"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    image: siipi/api:${SIIPI_VERSION:?la version à servir est fixée par les scripts de backend/exploitation/deploiement}
    container_name: ${SIIPI_INSTANCE:-siipi}_api
    restart: always
    init: true
    environment:
      DATABASE_URL: postgres://siipi_admin:${DB_PASSWORD:?}@db:5432/siipi_national
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini dans .env}
      # Jusqu'à la v0.15.72, ce compose ne passait pas ce secret : l'API refusait de
      # démarrer en production (secret de développement détecté). Le premier
      # démarrage réel du compose, au lot P4, l'a montré.
      SIIPI_SECRET_IDENTITES: ${SIIPI_SECRET_IDENTITES:?SIIPI_SECRET_IDENTITES doit être défini dans .env (openssl rand -hex 32)}
      # La clé des secrets du connecteur GPS (lot 17.4a) : jetons des fournisseurs et
      # secrets de webhook sont chiffrés avec elle. La perdre rend les jetons
      # enregistrés illisibles : chaque commune les ressaisit.
      SIIPI_SECRET_GPS: ${SIIPI_SECRET_GPS:?SIIPI_SECRET_GPS doit être défini dans .env (openssl rand -hex 32)}
      SIIPI_GPS_PLANIFICATEUR: active
      # Facultatifs : sans eux, les notifications push et les courriels ne partent
      # pas, et la plateforme le dit (« non configuré »).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@fnct.tn}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITE: ${SMTP_SECURITE:-starttls}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      COURRIEL_EXPEDITEUR: ${COURRIEL_EXPEDITEUR:-SIIPI <ne-pas-repondre@siipi.tn>}
      COURRIEL_URL_PORTAIL: https://${SIIPI_DOMAINE:?}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      SIIPI_FICHIERS_DIR: /var/siipi/fichiers
      SIIPI_ARCHIVE_DIR: /var/siipi/archive
      SIIPI_CONSERVATION_MEDIAS: active
      # La base garde ce qu'elle est (migration 067) : une base servie une fois en
      # production le reste, et refuse le mode formation.
      PRODUCTION: ${PRODUCTION:-true}
      FORMATION: ${FORMATION:-false}
      # Le front et l'API ont la même origine derrière le frontal : CORS ne sert plus
      # qu'à refuser les autres.
      CORS_ORIGIN: https://${SIIPI_DOMAINE:?}
      # Un seul proxy de confiance devant l'API : le frontal. Sans cela, toutes les
      # requêtes auraient son adresse, et la limite des tentatives de connexion
      # deviendrait celle de tout le pays (src/config.ts).
      TRUST_PROXY: 1
      NODE_ENV: production
    volumes:
      # Les octets des photos et documents. Volume nommé : ils survivent à la
      # reconstruction du conteneur, et une sauvegarde du volume suffit à les
      # emporter — ils ne sont pas en base, volontairement.
      - siipi_fichiers:/var/siipi/fichiers
      - siipi_archive_froide:/var/siipi/archive
      # Le constat de la surveillance (lot P5), lu en lecture seule.
      - siipi_supervision:/var/siipi/supervision:ro
    depends_on:
      db:
        condition: service_healthy
    # Aucun port sur l'hôte : on n'atteint l'API que par le frontal.
    networks: [siipi-net]

  surveillance:
    build:
      context: ./backend/exploitation/surveillance
    image: siipi/surveillance:${SIIPI_VERSION:?la version à servir est fixée par les scripts de backend/exploitation/deploiement}
    container_name: ${SIIPI_INSTANCE:-siipi}_surveillance
    restart: always
    environment:
      SIIPI_INSTANCE: ${SIIPI_INSTANCE:-siipi}
      SUPERVISION_API: http://api:4000
      SUPERVISION_SITE: https://${SIIPI_DOMAINE:?}
      # Le site se joint par le frontal, sur le réseau interne : le nom public peut
      # ne pas se résoudre vers ce serveur depuis l'intérieur.
      SUPERVISION_CONNEXION: frontal:443
      SUPERVISION_DESTINATAIRES: ${SUPERVISION_DESTINATAIRES:-}
      SUPERVISION_DISQUES: /var/lib/postgresql/data /var/siipi/fichiers /var/siipi/sauvegardes
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITE: ${SMTP_SECURITE:-starttls}
      SMTP_UTILISATEUR: ${SMTP_UTILISATEUR:-}
      SMTP_MOT_DE_PASSE: ${SMTP_MOT_DE_PASSE:-}
      COURRIEL_EXPEDITEUR: ${COURRIEL_EXPEDITEUR:-SIIPI <ne-pas-repondre@siipi.tn>}
    volumes:
      # Lecture seule : la surveillance regarde, elle ne touche à rien.
      - siipi_postgres_data:/var/lib/postgresql/data:ro
      - siipi_fichiers:/var/siipi/fichiers:ro
      - siipi_sauvegardes:/var/siipi/sauvegardes:ro
      - siipi_supervision:/var/siipi/supervision
    networks: [siipi-net]

  frontal:
    build:
      context: ./web
    image: siipi/frontal:${SIIPI_VERSION:?la version à servir est fixée par les scripts de backend/exploitation/deploiement}
    container_name: ${SIIPI_INSTANCE:-siipi}_frontal
    restart: always
    environment:
      SIIPI_DOMAINE: ${SIIPI_DOMAINE:?SIIPI_DOMAINE doit être défini dans .env (le nom du serveur)}
      SIIPI_TLS: ${SIIPI_TLS:?SIIPI_TLS doit être défini dans .env (une adresse pour Let's Encrypt, ou les chemins du certificat de la DSI)}
    volumes:
      - ./backend/exploitation/frontal/Caddyfile:/etc/caddy/Caddyfile:ro
      # Le certificat de la DSI, s'il y en a un : /certificats/cert.pem et cle.pem.
      - ./certificats:/certificats:ro
      # Les certificats obtenus et la clé du compte Let's Encrypt : gardés d'un
      # redémarrage à l'autre, sinon chaque démarrage redemanderait un certificat.
      - caddy_donnees:/data
      - caddy_config:/config
      # Le témoin « maintenance en cours » (lot P6) : sur un volume, il survit au
      # remplacement du frontal par sa nouvelle version au milieu d'une mise à jour.
      - siipi_maintenance:/maintenance
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on: [api]
    networks: [siipi-net]

  sauvegarde:
    build:
      context: ./backend/exploitation/sauvegarde
    image: siipi/sauvegarde:${SIIPI_VERSION:?la version à servir est fixée par les scripts de backend/exploitation/deploiement}
    container_name: ${SIIPI_INSTANCE:-siipi}_sauvegarde
    restart: always
    environment:
      PGHOST: db
      PGUSER: siipi_admin
      PGPASSWORD: ${DB_PASSWORD:?}
      PGDATABASE: siipi_national
      SAUVEGARDE_INSTANCE: ${SIIPI_INSTANCE:-siipi}
      SAUVEGARDE_DESTINATAIRES: ${SAUVEGARDE_DESTINATAIRES:-}
      SAUVEGARDE_DESTINATION: ${SAUVEGARDE_DESTINATION:-}
      SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-02:30}
      SIIPI_FICHIERS_DIR: /var/siipi/fichiers
      SIIPI_ARCHIVE_DIR: /var/siipi/archive
    env_file:
      # La description du distant rclone (RCLONE_CONFIG_<NOM>_TYPE, _HOST, _USER…),
      # avec ses secrets : hors du dépôt, et facultative — sans elle, une
      # destination ne peut être qu'un chemin monté.
      - path: ./sauvegarde.env
        required: false
    volumes:
      # Lecture seule : la sauvegarde lit les fichiers, elle ne les touche jamais.
      - siipi_fichiers:/var/siipi/fichiers:ro
      - siipi_archive_froide:/var/siipi/archive:ro
      - siipi_sauvegardes:/var/siipi/sauvegardes
    depends_on:
      db:
        condition: service_healthy
    networks: [siipi-net]

volumes:
  siipi_postgres_data:
  siipi_fichiers:
  siipi_archive_froide:
  # Les archives chiffrées et les témoins de la dernière réussite et du dernier
  # échec (lus par la supervision, lot P5).
  siipi_sauvegardes:
  caddy_donnees:
  caddy_config:
  # Le constat de la surveillance (lot P5) : écrit par elle, lu par l'API.
  siipi_supervision:
  siipi_maintenance:

networks:
  siipi-net:
    driver: bridge
