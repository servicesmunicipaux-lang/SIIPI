# ---------------------------------------------------------------------------
# SIIPI — environnement de développement local, tout en conteneurs.
#
#   docker compose up                 démarre base + API + front-end
#   docker compose run --rm api npm run migrate     applique les migrations
#   docker compose run --rm api npm run seed        importe les 350 communes
#   docker compose run --rm api npm run import:boundaries   frontières réelles
#   docker compose down               arrête tout (les données sont conservées)
#   docker compose down -v            arrête ET efface la base
#
# Une fois démarré :
#   Front-end        http://localhost:3000
#   API              http://localhost:4000/health
#   Adminer (base)   http://localhost:8081
#
# Note : les dépendances (node_modules) sont installées DANS les conteneurs,
# dans des volumes nommés. C'est volontaire : les paquets natifs installés
# sous Windows ne fonctionnent pas dans un conteneur Linux. Votre dossier
# node_modules local n'est ni lu ni écrit par Docker.
# ---------------------------------------------------------------------------

# Aucun « container_name » ici, volontairement : un nom de conteneur fige
# empeche Compose de recreer le service tant qu'un conteneur du meme nom
# subsiste — y compris arrete, y compris venu d'un autre projet. On obtient
# alors « Conflict. The container name /siipi_db is already in use », et le
# demarrage s'arrete sur un probleme qui n'en est pas un. Laisser Compose
# nommer ses conteneurs (siipi-db-1, siipi-api-1…) supprime toute la classe
# de problemes ; les donnees, elles, vivent dans des volumes nommes et
# survivent a la recreation des conteneurs.

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: siipi_national
      POSTGRES_USER: siipi_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siipi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - siipi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siipi_admin -d siipi_national"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    init: true
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      DATABASE_URL: postgres://siipi_admin:${DB_PASSWORD:-siipi_dev_password}@db:5432/siipi_national
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_before_any_real_deployment}
      JWT_EXPIRES_IN: 8h
      PORT: 4000
      SIIPI_FICHIERS_DIR: /var/siipi/fichiers
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: development
      # Notifications push (Jalon 2, lot 1) : paire de développement, comme un
      # certificat auto-signé — rien à payer, rien à souscrire. À remplacer
      # avant tout déploiement réel avec `npm run vapid:generer` (backend/.env.example).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BOM754xPkQeWDMf-RTg7bZ8cACy-SlN2yEO54w-W-lHpT0hlkpkY6BHD1UO7fufpFf0UqOEamqWzL5r1qSrKvOM}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-z55dT82Eu7bdDSK7kLCLM-4wccgUi2I-CF0xaVF1cN8}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@fnct.tn}
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      # Les octets des photos et documents. Volume nommé : ils survivent à la
      # reconstruction du conteneur, et une sauvegarde du volume suffit à les
      # emporter — ils ne sont pas en base, volontairement.
      - siipi_fichiers:/var/siipi/fichiers
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # Front-end : le dossier web/, et non la racine du dépôt. La racine contient
  # encore l'ancienne interface (src/, index.html, vite.config.ts) : tant que
  # ce service pointait dessus, « docker compose up » servait l'ancien écran et
  # le nouveau restait invisible.
  web:
    image: node:22-alpine
    init: true
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    environment:
      # Cible du proxy /api du serveur de développement, vue depuis CE
      # conteneur : sur le réseau Compose, l'API s'appelle « api ».
      # Le navigateur, lui, ne connaît que /api sur l'origine de la page.
      SIIPI_API_TARGET: http://api:4000
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  siipi_postgres_data:
  siipi_fichiers:
  api_node_modules:
  web_node_modules:
